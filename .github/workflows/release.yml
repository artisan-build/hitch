name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Explain guarded publishers
        run: |
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN}" ]; then
            echo "Homebrew tap publish skipped: HOMEBREW_TAP_GITHUB_TOKEN is not configured."
          fi
          if [ -z "${NPM_TOKEN}" ]; then
            echo "npm publish skipped: NPM_TOKEN is not configured."
          elif [ "${NPM_PUBLISH_ENABLED}" != "true" ]; then
            echo "npm publish skipped: NPM_PUBLISH_ENABLED repository variable is not set to true."
          fi
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_ENABLED: ${{ env.NPM_PUBLISH_ENABLED }}

      - name: Release GitHub assets
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Do not enable npm publishing until npm/hitch-mcp/bin/hitch-mcp.js has an automated test.
      # Its redirect-handling bug shipped undetected because nothing ever ran the downloader.
      - name: Setup Node for npm publish
        if: ${{ env.HAS_NPM_TOKEN == 'true' && env.NPM_PUBLISH_ENABLED == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Do not enable npm publishing until npm/hitch-mcp/bin/hitch-mcp.js has an automated test.
      # Its redirect-handling bug shipped undetected because nothing ever ran the downloader.
      - name: Publish npm shim
        if: ${{ env.HAS_NPM_TOKEN == 'true' && env.NPM_PUBLISH_ENABLED == 'true' }}
        working-directory: npm/hitch-mcp
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
