name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Check formatting
        run: gofmt -l . | (! grep .)
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: Test installer
        run: sh test/install-sh-test.sh
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          args: check
      - name: Test
        run: go test ./...
